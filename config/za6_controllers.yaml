controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    pose_controller:
      type: taskspace_controllers/PoseController
    as_nullspace_controller:
      type: axially_symmetric_controllers/NullspaceController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

pose_controller:
  ros__parameters:
    command_interfaces:
      - position
      - velocity

    base_link: base_link
    eef_link: flange

    k_position: 10.0
    k_orient: 10.0

as_nullspace_controller:
  ros__parameters:
    command_interfaces:
      - position
      - velocity

    base_link: base_link
    eef_link: flange

    k_position: 10.0
    k_orient: 10.0

    rr_objective_type: match_configuration
    match_config: [1.157, 0.576, 0.576, 0.890, -1.292, -0.332]
    k_config: 10.0

    eef_frame_axis: [1.0, 0.0, 0.0]
    setpoint_frame_axis: [1.0, 0.0, 0.0]
